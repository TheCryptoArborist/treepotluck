name: Pot Luck compiler validation

# Validation only: no wallet, publish, deployment, or transfer steps.
# Once this file is placed at the repository root, GitHub Actions can trigger it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pot-luck-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and verify boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the revision being tested
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run pinned compiler validation
        run: python3 scripts/ci_validate.py
      - name: Preserve this run's evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pot-luck-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
